[project]
name = "weather-truck-routing-backend"
version = "1.0.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# En dashes in prose are intentional; DRF declares views with mutable class attributes.
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]
